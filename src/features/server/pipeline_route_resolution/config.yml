feature: pipeline_route_resolution
stage: 4
case_sensitive: true
trailing_slash_sensitive: false
routes:
- path_template: /api/v1/resource
  allowed_methods:
  - GET
  handler_name: resource_handler
  required_scopes:
  - read
- path_template: /api/v1/resource
  allowed_methods:
  - POST
  handler_name: resource_handler
  required_scopes:
  - write
